# Linux path configuration for SmartMet workstation
# Equivalent of paths_dev.conf / paths_fmi.conf for Linux environments

# SmartMet source and configuration paths
smartmetPath = /home/mheiskan/hub/workstation
smartmetSourcePath = /home/mheiskan/hub/workstation/src/SmartMet
smartmetConfPath = /tmp/smartmet-workstation-conf-fmi

# Factory settings path (shipped with the source)
FactorySettingsPath = /home/mheiskan/hub/workstation/src/SmartMet/factory_settings

# Local configuration path (factory settings as fallback)
localPath = /home/mheiskan/hub/workstation/src/SmartMet/factory_settings

# Data paths - adjust these to your local data directory
# For now, point to test data
dataPath = /home/mheiskan/check/textgenapps/test/data
dataPathEuro = /home/mheiskan/check/textgenapps/test/data
dataPathCache = /tmp/smartmet/cache
dataPath4 = /tmp/smartmet/cache
dataPathStatic = /tmp/smartmet/static

# Create cache directories
# (The application should create these if they don't exist)

# Cloud/Dropbox paths - not available on Linux, use local fallback
cloudPath = /tmp/smartmet/cloud
macroParamDataPath = /tmp/smartmet/macroparamdata

# Error/log paths
ErrorFilePath = /tmp/smartmet/error

# SILAM path (atmospheric transport)
silamPath = /tmp/smartmet/silam

# Logger configuration
SmartMet::LogFilePath = /tmp/smartmet/logs
SmartMet::LogLevel = 3
