# Help data configuration for the Linux port.
#
# NFmiHelpDataInfoSystem::InitFromSettings("MetEditor::HelpData", ...) reads this. Each
# Dynamic/Static entry gives a file filter; the newest matching file is loaded at startup.
# DataType values come from NFmiInfoData::Type (2 = kViewable, 3 = kStationary).

# Local querydata cache. The Linux port reads the files straight from their configured
# location, so caching is off and UsedFileNameFilter() returns the filter as written below.
MetEditor::HelpData::LocalDataBaseDirectory = ${dataPathCache}
MetEditor::HelpData::CacheTmpFileNameFix = TMP
MetEditor::HelpData::UseQueryDataCache = 0

MetEditor::HelpData::DoCleanCache = 0
MetEditor::HelpData::CacheFileKeepMaxDays = 2
MetEditor::HelpData::CacheMaxFilesPerPattern = 5
MetEditor::HelpData::CacheMediumFileSizeMB = 40
MetEditor::HelpData::CacheLargeFileSizeMB = 200
MetEditor::HelpData::CacheMaximumFileSizeMB = 100000

# Model data. One entry per file filter - N/P cycle through them in the running application.
MetEditor::HelpData::Dynamic::fmi_surface::FilenameFilter = ${dataPath}/fmi.sqd
MetEditor::HelpData::Dynamic::fmi_surface::DataType = 2
MetEditor::HelpData::Dynamic::fmi_surface::Enable = 1

MetEditor::HelpData::Dynamic::europe_pressurelevels::FilenameFilter = ${dataPath}/europe_pressurelevels*.sqd
MetEditor::HelpData::Dynamic::europe_pressurelevels::DataType = 2
MetEditor::HelpData::Dynamic::europe_pressurelevels::Enable = 1

MetEditor::HelpData::Dynamic::meps_pressurelevels::FilenameFilter = ${dataPath}/meps_pressurelevels.sqd
MetEditor::HelpData::Dynamic::meps_pressurelevels::DataType = 2
MetEditor::HelpData::Dynamic::meps_pressurelevels::Enable = 1

MetEditor::HelpData::Dynamic::radar::FilenameFilter = ${dataPath}/radar.sqd
MetEditor::HelpData::Dynamic::radar::DataType = 2
MetEditor::HelpData::Dynamic::radar::Enable = 1
